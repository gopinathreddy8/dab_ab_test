# This is a Databricks asset bundle definition for dab_ab_jpl.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_ab_jpl
  uuid: 423c519c-0174-4084-a7db-8362d62e59f0

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-04334767-d49e.cloud.databricks.com
    variables:
      catalog: db_ab_test
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-04334767-d49e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gopinathreddy008.d@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gopinathreddy008.d@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: db_ab_prod
      schema: rnd
    permissions:
      - user_name: gopinathreddy008.d@gmail.com
        level: CAN_MANAGE
      - service_principal_name: sp_exec_ab
        level: CAN_MANAGE
